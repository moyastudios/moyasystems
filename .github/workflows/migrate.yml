name: Migrate database
# Run manually: Actions → Migrate database → Run workflow.
# Applies Prisma migrations and (re)applies sql/roles.sql as the Neon owner.
# Secrets (Settings → Secrets and variables → Actions):
#   MIGRATE_DATABASE_URL   owner connection string, direct (non-pooled) host
#   WB_API_DB_PASSWORD     optional: sets the wb_api login password
#   WB_CONFIG_DB_PASSWORD  optional: sets the wb_config login password
on:
  workflow_dispatch:

concurrency:
  group: migrate-database
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      MIGRATE_DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
    steps:
      - name: Check secret
        run: test -n "$MIGRATE_DATABASE_URL" || { echo "::error::Add the MIGRATE_DATABASE_URL secret first."; exit 1; }
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: which psql || (sudo apt-get update -q && sudo apt-get install -yq postgresql-client)
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Apply roles and grants
        run: pnpm db:roles
      - name: Set login passwords
        env:
          API_PW: ${{ secrets.WB_API_DB_PASSWORD }}
          CONFIG_PW: ${{ secrets.WB_CONFIG_DB_PASSWORD }}
        run: |
          # Passed as psql variables so they never appear in the command line or logs.
          if [ -n "$API_PW" ]; then
            echo "ALTER ROLE wb_api PASSWORD :'pw';" | psql "$MIGRATE_DATABASE_URL" -v ON_ERROR_STOP=1 -q -v pw="$API_PW"
            echo "wb_api password set"
          fi
          if [ -n "$CONFIG_PW" ]; then
            echo "ALTER ROLE wb_config PASSWORD :'pw';" | psql "$MIGRATE_DATABASE_URL" -v ON_ERROR_STOP=1 -q -v pw="$CONFIG_PW"
            echo "wb_config password set"
          fi
      - name: Build app connection strings
        env:
          API_PW: ${{ secrets.WB_API_DB_PASSWORD }}
          CONFIG_PW: ${{ secrets.WB_CONFIG_DB_PASSWORD }}
        run: |
          # Logs in exactly as the Vercel apps do (pooled host, app role) and prints the
          # DATABASE_URL each app should use, with the password replaced by ****.
          node -e '
            const owner = new URL(process.env.MIGRATE_DATABASE_URL);
            const [first, ...rest] = owner.hostname.split(".");
            const pooled = first.endsWith("-pooler") ? owner.hostname : [first + "-pooler", ...rest].join(".");
            for (const [role, pw, project] of [["wb_api", process.env.API_PW, "westbridge-api"], ["wb_config", process.env.CONFIG_PW, "westbridge-config"]]) {
              const u = new URL(owner); u.hostname = pooled; u.username = role; u.password = encodeURIComponent(pw ?? "");
              u.search = "?sslmode=require";
              require("fs").appendFileSync(process.env.GITHUB_ENV, `URL_${role}=${u.toString()}\n`);
              const shown = new URL(u); shown.password = "****";
              console.log(`${project} DATABASE_URL should be: ${shown.toString()}`);
            }'
      # Separate step: values written to GITHUB_ENV are only visible to later steps.
      - name: Log in as each app
        run: |
          for role in wb_api wb_config; do
            var="URL_$role"
            if psql "${!var}" -v ON_ERROR_STOP=1 -tAc "select current_user" >/dev/null; then
              echo "✅ $role can log in through the pooler"
            else
              echo "::error::$role could not log in through the pooler"; exit 1
            fi
          done
